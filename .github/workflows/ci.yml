name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Hygiene & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Linter (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run type-check

  test-and-validate:
    name: Unit Tests & Catalogue Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npm run test

      - name: Validate catalogue schemas & governance
        run: npm run validate:catalogue

      - name: Audit link health and allowlist integrity
        run: npm run check:links:offline

      - name: Generate catalogue staleness report
        run: npm run report:staleness

      - name: Security audit
        run: npm run audit:ci

  build:
    name: Production Build (Static Export)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-and-validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Verify production container packaging & security drill
        run: npm run docker:verify

      - name: Build production container image
        run: npm run docker:build

  e2e:
    name: End-to-End & Accessibility Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Next.js static export
        run: npm run build

      - name: Run Playwright E2E & Accessibility Tests
        run: npm run test:e2e
